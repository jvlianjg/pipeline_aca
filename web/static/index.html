<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACA · Sistema de Inteligencia y Medición de Impacto</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- ── Sidebar ───────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">A</div>
        <div>
          <div class="sidebar__title">Sistema de Inteligencia</div>
          <div class="sidebar__subtitle">ACA · Costa Rica</div>
        </div>
      </div>

      <nav class="sidebar__nav" id="nav">
        <button class="nav-item active" data-route="dashboard">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-route="analisis">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-7"/></svg>
          Análisis
        </button>
        <button class="nav-item" data-route="canales">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-9 4 18 3-9h6"/></svg>
          Canales
        </button>
        <button class="nav-item" data-route="auditoria">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Auditoría
        </button>
        <button class="nav-item" data-route="config">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Configuración
        </button>
      </nav>

      <div class="sidebar__footer">
        <div class="avatar">JD</div>
        <div class="avatar-info">
          <strong>Jose D.</strong>
          <span>Analista</span>
        </div>
      </div>
    </aside>

    <!-- ── Contenido ─────────────────────────────────────────── -->
    <div class="content">
      <header class="topbar">
        <div>
          <h1 class="topbar__title" id="page-title">Dashboard Ejecutivo</h1>
        </div>
        <span class="topbar__date">Julio 2026</span>
      </header>

      <main class="main">
        <div id="view"><!-- la vista se inyecta aquí por app.js --></div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
