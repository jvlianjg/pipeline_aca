<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACA · Sistema de Inteligencia y Medición de Impacto</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- ── Barra de navegación superior ──────────────────────── -->
  <header class="topnav">
    <div class="topnav__inner">
      <div class="topnav__brand">
        <div class="topnav__logo">A</div>
        <span class="topnav__title">Sistema de Inteligencia</span>
      </div>

      <nav class="topnav__nav" id="nav">
        <button class="nav-item active" data-route="dashboard">Dashboard</button>
        <button class="nav-item" data-route="analisis">Análisis</button>
        <button class="nav-item" data-route="canales">Canales</button>
        <button class="nav-item" data-route="auditoria">Auditoría</button>
        <button class="nav-item" data-route="config">Configuración</button>
      </nav>

      <div class="topnav__right">
        <div class="avatar">JD</div>
      </div>
    </div>
  </header>

  <!-- ── Contenido ─────────────────────────────────────────── -->
  <div class="content">
    <header class="topbar">
      <div>
        <h1 class="topbar__title" id="page-title">Dashboard Ejecutivo</h1>
      </div>
      <span class="topbar__date">Julio 2026</span>
    </header>

    <main class="main">
      <div id="view"><!-- la vista se inyecta aquí por app.js --></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
